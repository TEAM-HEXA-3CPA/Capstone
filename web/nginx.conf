server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Flask 인증 계열 API (login, signup, logout, me)
    location ~ ^/(login|signup|logout|me)$ {
        proxy_pass http://127.0.0.1:5000; # 🎯 backend -> 127.0.0.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flask 그룹 계열 API
    location /api/groups/ {
        proxy_pass http://127.0.0.1:5000/api/groups/; # 🎯 backend -> 127.0.0.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flask 랭킹 계열 API
    location /api/rank/ {
        proxy_pass http://127.0.0.1:5000/api/rank/; # 🎯 backend -> 127.0.0.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FastAPI AI 데이터 분석/스코어 스트림 엔진
location /api/ {
    proxy_pass https://choosy-reproach-squealer.ngrok-free.dev/;
    proxy_set_header Host choosy-reproach-squealer.ngrok-free.dev;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
}
