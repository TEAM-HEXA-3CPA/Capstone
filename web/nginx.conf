erver {
    listen 80;

    # ── 정적 파일 ──
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }

    # ── 인증 API (Flask 5000) ──
    location ~ ^/(login|signup|logout|me)$ {
        proxy_pass         http://localhost:5000;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization       $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── 그룹 API (Flask 5000) ──
    location /api/groups/ {
        proxy_pass         http://localhost:5000/api/groups/;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization       $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── 랭킹 API (Flask 5000) ──
    location /api/rank/ {
        proxy_pass         http://localhost:5000/api/rank/;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization       $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── 리포트 API (Flask 5000) ──
    location /api/report/ {
        proxy_pass         http://localhost:5000/api/report/;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization       $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── 카메라 스트리밍 (FastAPI 8000) - 타임아웃 해제 ──
    location = /api/stream {
        proxy_pass             http://localhost:8000/api/stream;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;

        # 스트리밍 전용 설정 (끊기지 않게)
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        keepalive_timeout      3600s;
        chunked_transfer_encoding on;
    }

    # ── 나머지 AI API (FastAPI 8000) ──
    location /api/ {
        proxy_pass         http://localhost:8000/;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization       $http_authorization;
        proxy_pass_header  Authorization;
    }
}
