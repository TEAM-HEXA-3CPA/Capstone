server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 🎯 [교정] 127.0.0.1을 focus-backend 컨테이너 이름으로 변경 (Flask 로그인 담당)
    location ~ ^/(login|signup|logout|me)$ {
        proxy_pass http://focus-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 🎯 [교정] 127.0.0.1을 focus-backend 컨테이너 이름으로 변경 (그룹 API 담당)
    location /api/groups/ {
        proxy_pass http://focus-backend:5000/api/groups/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 🎯 [교정] 127.0.0.1을 focus-backend 컨테이너 이름으로 변경 (FastAPI AI 담당)
    location /api/ {
        proxy_pass http://focus-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}