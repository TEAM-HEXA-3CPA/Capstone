server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 1. 로그인, 회원가입 관련 (Flask 5000번 포트)
    location ~ ^/(login|signup|logout|me)$ {
        proxy_pass http://focus-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. 스터디 그룹 관련 API (Flask 5000번 포트)
    location /api/groups/ {
        proxy_pass http://focus-backend:5000/api/groups/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. 🎯 [추가] 랭킹 관련 API (Flask 5000번 포트)
    location /api/rank/ {
        proxy_pass http://focus-backend:5000/api/rank/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. 나머지 일반 API 및 AI 관련 (8000번 포트)
    location /api/ {
        proxy_pass http://focus-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}