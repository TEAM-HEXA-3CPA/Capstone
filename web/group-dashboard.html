<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FocusMate | 그룹 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <style>
   </style>
</head>
<body>

    <header>
        <div class="logo">FocusMate</div>
        <nav>
            <a href="#">집중분석</a> <a href="#">전체랭킹</a>
            <a href="#" style="color: var(--primary);">그룹</a>
            <button class="theme-toggle-btn" id="themeToggleBtn">🌙</button>
        </nav>
    </header>

    <main class="container group-container">
        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2 style="font-size: 1.5rem; color: var(--text-main);">[그룹 이름]</h2>
                <div id="code-btn" style="cursor: pointer; background: var(--primary-light); color: var(--primary); padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
                    <span>[초대코드]</span>
                </div>
            </div>

            <div class="member-grid">
                <div class="member-card">
                    <div style="width: 60px; height: 60px; background: var(--border); border-radius: 50%; margin: 0 auto 12px;"></div>
                    <div style="font-weight: 700;">[닉네임]</div>
                    <div style="font-size: 0.8rem; color: var(--primary); margin-top: 4px;">● [상태]</div>
                </div>
            </div>

            <div class="member-time-list">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="font-size: 1.1rem; color: var(--text-main);">팀원별 누적 집중 시간</h3>
                    <span style="font-weight: 700; color: var(--primary);">총합: [전체시간]</span>
                </div>
                
                <div class="time-row">
                    <span style="font-weight: 500;">[닉네임]</span>
                    <span style="font-weight: 700; color: var(--primary);">[개인 누적 시간]</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
