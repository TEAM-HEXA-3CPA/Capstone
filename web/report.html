<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthVision - 몰입도 요약 리포트</title>
    <!-- Chart.js 라이브러리 로드 -->
     <body>
    <script>
        // 페이지 로드 즉시 세션스토리지의 로그인 여부 확인
        const loggedInUser = sessionStorage.getItem('user_id');
        if (!loggedInUser) {
            alert("로그인이 필요한 서비스입니다. 로그인 페이지로 이동합니다.");
            location.href = 'index.html'; // 로그인 페이지 파일명에 맞게 수정 (index.html 또는 login.html)
        }
    </script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 30px;
            text-align: center;
        }
        header h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 2.5rem;
        }
        header p {
            color: #7f8c8d;
            margin-top: 5px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }
        .card h3 {
            margin-top: 0;
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .status-summary {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .status-box {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            width: 30%;
        }
        .status-box.focus { background-color: #e8f8f5; color: #1abc9c; }
        .status-box.drowsy { background-color: #fef9e7; color: #f1c40f; }
        .status-box.away { background-color: #fadbd8; color: #e74c3c; }
        .status-box span { display: block; font-size: 1.8rem; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Focus Analysis Report</h1>
        <p>라즈베리파이 5분 요약 로그 기반 학습 모니터링 시스템</p>
    </header>

    <!-- 상단 요약 위젯 카드 -->
    <div class="card" style="margin-bottom: 20px;">
        <h3>금일 핵심 몰입 지표 요약</h3>
        <div class="status-summary">
            <div class="status-box focus">평균 몰입 점수<span id="widget-score">95점</span></div>
            <div class="status-box drowsy">누적 졸음 횟수<span id="widget-drowsy">0회</span></div>
            <div class="status-box away">누적 시선 이탈<span id="widget-away">1회</span></div>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- 1. 몰입 점수 추이 그래프 -->
        <div class="card">
            <h3>일주일간 평균 몰입도 추이 (%)</h3>
            <div class="chart-container">
                <canvas id="focusScoreChart"></canvas>
            </div>
        </div>

        <!-- 2. 졸음 및 이탈 횟수 비교 누적 바 차트 -->
        <div class="card">
            <h3>집중 방해 요소 분석 (졸음 vs 이탈)</h3>
            <div class="chart-container">
                <canvas id="disturbanceChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // 💡 데이터베이스에 집계된 수진님의 로그 패턴을 기반으로 한 가상 데이터셋 배열
    // 백엔드 API(Node.js / Python 등)와 연동할 때 이 구조 그대로 JSON을 응답해주면 됩니다.
    const dbDummyData = [
        { date: '05-30 (6일전)', avg_score: 97, drowsy: 0, away: 0 },
        { date: '05-31 (5일전)', avg_score: 52, drowsy: 0, away: 8 },
        { date: '06-01 (4일전)', avg_score: 35, drowsy: 12, away: 1 },
        { date: '06-02 (3일전)', avg_score: 0,  drowsy: 0, away: 0 }, // 휴식일 공백
        { date: '06-03 (2일전)', avg_score: 99, drowsy: 0, away: 0 },
        { date: '06-04 (1일전)', avg_score: 67, drowsy: 4, away: 3 },
        { date: '06-05 (오늘)',  avg_score: 95, drowsy: 0, away: 1 }  // image_a78b81.png의 실제 데이터가 반영된 부분!
    ];

    // 라벨 및 데이터 추출
    const labels = dbDummyData.map(item => item.date);
    const scoreData = dbDummyData.map(item => item.avg_score);
    const drowsyData = dbDummyData.map(item => item.drowsy);
    const awayData = dbDummyData.map(item => item.away);

    // ==========================================
    // 1. 몰입 점수 라인 차트 (Line Chart) 구현
    // ==========================================
    const ctxScore = document.getElementById('focusScoreChart').getContext('2d');
    new Chart(ctxScore, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '평균 몰입도 점수',
                data: scoreData,
                borderColor: '#1abc9c',
                backgroundColor: 'rgba(26, 188, 156, 0.1)',
                borderWidth: 3,
                pointBackgroundColor: '#1abc9c',
                pointRadius: 5,
                tension: 0.2, // 선의 부드러운 굴곡도
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { min: 0, max: 100, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });

    // ==========================================
    // 2. 졸음/이탈 이벤트 바 차트 (Grouped Bar Chart) 구현
    // ==========================================
    const ctxDisturb = document.getElementById('disturbanceChart').getContext('2d');
    new Chart(ctxDisturb, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '졸음 발생 (회)',
                    data: drowsyData,
                    backgroundColor: '#f1c40f',
                    borderRadius: 5
                },
                {
                    label: '시선 이탈 (회)',
                    data: awayData,
                    backgroundColor: '#e74c3c',
                    borderRadius: 5
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 2 }, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });

    // ==========================================
    // 💡 추후 백엔드 API와 실시간 연동 처리할 때 쓸 Ajax 가이드라인 함수
    // ==========================================
    /*
    async function fetchRealtimeReport() {
        try {
            const response = await fetch('/api/reports/summary?user_id=15');
            const data = await response.json();
            // 여기에 차트 데이터 갱신 로직(chart.update())을 작성하면 실시간 DB 연동 완료!
        } catch (error) {
            console.error("데이터 로드 실패:", error);
        }
    }
    */
</script>
</body>
</html>
