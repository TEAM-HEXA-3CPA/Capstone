<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusMate | 로그인 & 회원가입</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        .field-error {
            color: #ef4444;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 4px;
            display: none;
        }
        .input-group input.invalid { border-color: #ef4444; }
        .input-group input.valid   { border-color: var(--primary); }
        .pw-strength-bar {
            height: 4px;
            border-radius: 99px;
            background: var(--border);
            margin-top: 6px;
            overflow: hidden;
        }
        .pw-strength-fill {
            height: 100%;
            border-radius: 99px;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
    </style>
</head>
<body>

<header>
    <a href="main-home.html" class="logo" style="text-decoration: none;">FocusMate</a>
    <nav style="display: flex; align-items: center;">
        <a href="control.html">집중분석</a>
        <a href="rank.html">전체랭킹</a>
        <a href="index.html" style="color: var(--primary); font-weight: 800; margin-left: 25px;">로그인</a>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" style="margin-left: 25px;">🌙</button>
    </nav>
</header>

<div class="container">
    <section id="login">
        <div class="auth-card card">
            <div class="auth-info">
                <h2>다시 몰입할<br>시간입니다.</h2>
                <p style="color:var(--text-sub)">아이디와 비밀번호를 입력하고 학습을 이어가세요.</p>
            </div>
            <div id="loginForm">
                <div class="input-group">
                    <label>아이디</label>
                    <input type="text" id="login_id" placeholder="ID" required>
                    <div class="field-error" id="login_id_err"></div>
                </div>
                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" id="login_pw" placeholder="Password" required>
                    <div class="field-error" id="login_pw_err"></div>
                </div>
                <div class="field-error" id="login_global_err" style="margin-bottom:15px; text-align:center;"></div>
                <button type="button" id="loginBtn" class="btn btn-primary" onclick="handleLogin()">로그인</button>
            </div>
            <div class="auth-toggle" style="margin-top:12px;">
                <button type="button" class="btn" onclick="toggleAuthView('signup')" style="width:100%; background:transparent; border:1.5px solid var(--primary); color:var(--primary); font-weight:700;">회원가입</button>
            </div>
        </div>
    </section>

    <section id="signup" style="display:none;">
        <div class="auth-card card">
            <div class="auth-info">
                <h2>FocusMate와<br>함께 시작하세요.</h2>
                <p style="color:var(--text-sub)">실시간 AI 분석을 기반으로 최적의 학습 리포트를 제공합니다.</p>
            </div>
            <div id="signupForm">
                <div class="input-group">
                    <label>이름</label>
                    <input type="text" id="reg_name" placeholder="홍길동" required>
                    <div class="field-error" id="reg_name_err"></div>
                </div>
                <div class="input-group">
                    <label>전화번호</label>
                    <input type="tel" id="reg_phone" placeholder="01012345678" required>
                    <div class="field-error" id="reg_phone_err"></div>
                </div>
                <div class="input-group">
                    <label>이메일</label>
                    <input type="email" id="reg_email" placeholder="example@yju.ac.kr" required>
                    <div class="field-error" id="reg_email_err"></div>
                </div>
                <div class="input-group">
                    <label>닉네임</label>
                    <input type="text" id="reg_nickname" placeholder="닉네임" required>
                    <div class="field-error" id="reg_nickname_err"></div>
                </div>
                <div class="input-group">
                    <label>아이디</label>
                    <input type="text" id="reg_id" placeholder="영문, 숫자 조합 4~12자" required>
                    <div class="field-error" id="reg_id_err"></div>
                </div>
                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" id="reg_pw" placeholder="8자 이상, 영문/숫자/특수문자 조합" required oninput="checkPasswordStrength()">
                    <div class="pw-strength-bar"><div class="pw-strength-fill" id="pwStrengthFill"></div></div>
                    <div class="field-error" id="reg_pw_err"></div>
                </div>
                <div class="field-error" id="signup_global_err" style="margin-bottom:15px; text-align:center;"></div>
                <button type="button" id="signupBtn" class="btn btn-primary" onclick="handleSignup()">회원가입</button>
            </div>
            <div class="auth-toggle" style="margin-top:12px;">
                <button type="button" class="btn" onclick="toggleAuthView('login')" style="width:100%; background:transparent; border:1.5px solid var(--primary); color:var(--primary); font-weight:700;">로그인으로 돌아가기</button>
            </div>
        </div>
    </section>
</div>

<script src="script.js"></script>
<script>
// ★ 이미 로그인된 상태면 메인으로 이동
(function checkAlreadyLoggedIn() {
    if (Auth.isLoggedIn()) {
        location.replace('main-home.html');
    }
})();
</script>
<script>
function toggleAuthView(view) {
    document.getElementById('login').style.display  = view === 'signup' ? 'none'  : 'block';
    document.getElementById('signup').style.display = view === 'signup' ? 'block' : 'none';
}

function showErr(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.innerText = msg; el.style.display = 'block'; }
}
function clearErr(id) {
    const el = document.getElementById(id);
    if (el) { el.innerText = ''; el.style.display = 'none'; }
}

async function handleLogin() {
    const user_id  = document.getElementById('login_id').value.trim();
    const password = document.getElementById('login_pw').value;

    clearErr('login_id_err');
    clearErr('login_pw_err');
    clearErr('login_global_err');

    let valid = true;
    if (!user_id)  { showErr('login_id_err', '아이디를 입력해주세요.');   valid = false; }
    if (!password) { showErr('login_pw_err', '비밀번호를 입력해주세요.'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('loginBtn');
    btn.disabled    = true;
    btn.textContent = '로그인 중...';

    try {
        const form = new FormData();
        form.append('user_id',  user_id);
        form.append('password', password);

        const res  = await fetch('/login', { method: 'POST', body: form });
        const data = await res.json();

        if (data.ok) {
            // ★ JWT 토큰 저장 (30분 만료 시각 포함)
            Auth.setToken(data.token);
            sessionStorage.setItem('nickname', data.nickname);
            sessionStorage.setItem('user_id',  data.user_id);
            if (data.group_id) sessionStorage.setItem('groupId', data.group_id);

            alert(`${data.nickname}님, 환영합니다!`);
            location.href = 'main-home.html';
        } else {
            showErr('login_global_err', data.message || '아이디 또는 비밀번호가 올바르지 않습니다.');
        }
    } catch (e) {
        showErr('login_global_err', '서버에 연결할 수 없습니다.');
    } finally {
        btn.disabled    = false;
        btn.textContent = '로그인';
    }
}

async function handleSignup() {
    const name     = document.getElementById('reg_name').value.trim();
    const phone    = document.getElementById('reg_phone').value.trim();
    const email    = document.getElementById('reg_email').value.trim();
    const nickname = document.getElementById('reg_nickname').value.trim();
    const user_id  = document.getElementById('reg_id').value.trim();
    const password = document.getElementById('reg_pw').value;

    clearErr('signup_global_err');

    const btn = document.getElementById('signupBtn');
    btn.disabled    = true;
    btn.textContent = '가입 중...';

    try {
        const form = new FormData();
        form.append('name',     name);
        form.append('phone',    phone);
        form.append('email',    email);
        form.append('nickname', nickname);
        form.append('user_id',  user_id);
        form.append('password', password);

        const res  = await fetch('/signup', { method: 'POST', body: form });
        const data = await res.json();

        if (data.ok) {
            // ★ 회원가입 후 바로 토큰 저장
            Auth.setToken(data.token);
            sessionStorage.setItem('nickname', data.nickname);
            sessionStorage.setItem('user_id',  data.user_id);

            alert(data.message);
            location.href = 'main-home.html';
        } else {
            showErr('signup_global_err', data.message);
        }
    } catch (e) {
        showErr('signup_global_err', '서버 통신 오류가 발생했습니다.');
    } finally {
        btn.disabled    = false;
        btn.textContent = '회원가입';
    }
}

function checkPasswordStrength() {
    const pw   = document.getElementById('reg_pw').value;
    const fill = document.getElementById('pwStrengthFill');
    let score  = 0;
    if (pw.length >= 8) score++;
    if (/[A-Za-z]/.test(pw) && /[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;

    if      (score === 1) { fill.style.width = '33%';  fill.style.backgroundColor = '#ef4444'; }
    else if (score === 2) { fill.style.width = '66%';  fill.style.backgroundColor = '#f59e0b'; }
    else if (score === 3) { fill.style.width = '100%'; fill.style.backgroundColor = '#009460'; }
    else                  { fill.style.width = '0%'; }
}
</script>
</body>
</html>
