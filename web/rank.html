<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusMate | 랭킹 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>

<header>
    <a href="main-home.html" class="logo" style="text-decoration: none;">FocusMate</a>
    <nav style="display: flex; align-items: center;">
        <a href="control.html">집중분석</a>
        <a href="rank.html" style="color: var(--primary); font-weight: 800;">전체랭킹</a>
        <a href="create-group.html">그룹</a>
        <div class="user-menu-container">
            <a href="#" id="userTrigger" onclick="toggleUserDropdown(event)" class="user-menu-trigger">👤 님 ▾</a>
            <div class="user-dropdown-box" id="userDropdown">
                <div class="user-info-summary">
                    <div class="user-info-name"></div>
                    <div class="user-info-email"></div>
                    <a href="report.html" class="dropdown-item" style="color: var(--primary); font-weight: bold; padding-left: 0;">📊 나의 몰입 리포트</a>
                </div>
                <div class="dropdown-divider"></div>
                <a href="#" onclick="handleLeaveGroup(event)" class="dropdown-item">🏃 소속 그룹 탈퇴</a>
                <a href="#" onclick="handleDeleteAccount(event)" class="dropdown-item danger">❌ 서비스 회원 탈퇴</a>
                <div class="dropdown-divider"></div>
                <a href="#" onclick="handleLogout(event)" class="dropdown-item" style="color: var(--text-sub);">로그아웃</a>
            </div>
        </div>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" style="margin-left: 25px;">🌙</button>
    </nav>
</header>

<div class="container">
    <section id="rank">
        <div class="my-stats-banner">
            <div>
                <span style="opacity: 0.8; font-size: 0.9rem;">전체 순위</span>
                <h3 id="myStatusText" style="font-size: 1.8rem;">로딩 중...</h3>
            </div>
            <div style="text-align: center;">
                <span style="opacity: 0.8; font-size: 0.9rem;">그룹 내 순위</span>
                <h3 id="myGroupRankText" style="font-size: 1.8rem;">-</h3>
            </div>
            <div style="text-align: right;">
                <span style="opacity: 0.8; font-size: 0.9rem;">누적 학습 점수</span>
                <h3 id="myScoreText" style="font-size: 1.8rem; color: #f59e0b;">0 pts</h3>
            </div>
        </div>

        <div class="rank-grid">
            <div class="card">
                <h3>🌍 전체 실시간 랭킹 TOP 10</h3>
                <table class="rank-table">
                    <thead><tr><th>순위</th><th>닉네임</th><th>몰입 점수</th><th>총 시간</th></tr></thead>
                    <tbody id="globalRankBody"></tbody>
                </table>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3>👥 우리 그룹 랭킹 (<span id="groupNameLabel" style="color:var(--primary); font-weight:700;">-</span>)</h3>
                </div>
                <table class="rank-table" style="margin-top: 0;">
                    <thead><tr><th>순위</th><th>닉네임</th><th>몰입 점수</th><th>총 시간</th></tr></thead>
                    <tbody id="groupRankBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const BASE_URL = '/api/rank';

    // ── 1. 내 정보 + 그룹 내 순위 (JWT)
    try {
        const resMe = await Auth.fetch(`${BASE_URL}/me`);
        if (resMe.ok) {
            const dataMe = await resMe.json();
            if (dataMe.ok) {
                document.getElementById("myStatusText").innerText = `전체 ${dataMe.global_rank}위`;
                document.getElementById("myScoreText").innerText  = `${dataMe.score.toLocaleString()} pts`;
            }
        }
    } catch (e) { console.error("내 정보 로드 실패:", e); }

    // ── 2. 전체 랭킹 (인증 불필요)
    try {
        const resGlobal = await fetch(`${BASE_URL}/global`);
        if (resGlobal.ok) {
            const dataGlobal = await resGlobal.json();
            const globalBody = document.getElementById("globalRankBody");
            globalBody.innerHTML = "";
            if (!dataGlobal.ok || dataGlobal.data.length === 0) {
                globalBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-sub); padding:40px 0;">등록된 랭킹 데이터가 없습니다.</td></tr>`;
            } else {
                const currentUserId = sessionStorage.getItem('user_id') || '';
                dataGlobal.data.forEach((user) => {
                    let rankLabel = user.rank;
                    if (user.rank === 1) rankLabel = "🥇 1";
                    else if (user.rank === 2) rankLabel = "🥈 2";
                    else if (user.rank === 3) rankLabel = "🥉 3";
                    const isMe = user.string_id === currentUserId ? 'style="font-weight:700; color:var(--primary);"' : '';
                    globalBody.innerHTML += `<tr><td>${rankLabel}</td><td ${isMe}>${user.nickname}</td><td>${user.score.toLocaleString()}</td><td>${user.study_time}</td></tr>`;
                });
            }
        }
    } catch (e) { console.error("전체 랭킹 로드 실패:", e); }

    // ── 3. 그룹 랭킹 + 그룹 내 내 순위 (JWT)
    try {
        const resGroup = await Auth.fetch(`${BASE_URL}/group`);
        if (resGroup.ok) {
            const dataGroup = await resGroup.json();
            const groupBody = document.getElementById("groupRankBody");
            groupBody.innerHTML = "";

            if (!dataGroup.ok || !dataGroup.group || dataGroup.data.length === 0) {
                groupBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-sub); padding:40px 0;">소속된 그룹이 없습니다.</td></tr>`;
                document.getElementById("myGroupRankText").innerText = "-";
            } else {
                document.getElementById("groupNameLabel").innerText = dataGroup.group.name;
                // 그룹 내 내 순위 배너에 표시
                document.getElementById("myGroupRankText").innerText =
                    dataGroup.my_rank ? `그룹 ${dataGroup.my_rank}위` : "-";

                dataGroup.data.forEach((user) => {
                    const isMe = user.is_me ? 'style="font-weight:700; color:var(--primary);"' : '';
                    groupBody.innerHTML += `<tr><td>${user.rank}</td><td ${isMe}>${user.nickname}</td><td>${user.score.toLocaleString()}</td><td>${user.study_time}</td></tr>`;
                });
            }
        }
    } catch (e) { console.error("그룹 랭킹 로드 실패:", e); }
});
</script>
</body>
</html>
