<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusMate | 랭킹 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>

<header>
    <a href="main-home.html" class="logo" style="text-decoration: none;">FocusMate</a>
    <nav style="display: flex; align-items: center;">
        <a href="control.html">집중분석</a>
        <a href="rank.html" style="color: var(--primary); font-weight: 800;">전체랭킹</a>
        <a href="create-group.html">그룹</a>
        
        <div class="user-menu-container">
            <a href="#" id="userTrigger" onclick="toggleUserDropdown(event)" class="user-menu-trigger">👤 aa5467aa님 ▾</a>
            <div class="user-dropdown-box" id="userDropdown">
                <div class="user-info-summary">
                    <div class="user-info-name">aa5467aa</div>
                    <div class="user-info-email">focusmate_user@yju.ac.kr</div>
                    <a href="report.html" class="dropdown-item" style="color: var(--primary); font-weight: bold; padding-left: 0;">📊 나의 몰입 리포트</a>
                </div>
                <div class="dropdown-divider"></div>
                <a href="#" onclick="handleLeaveGroup(event)" class="dropdown-item">🏃 소속 그룹 탈퇴</a>
                <a href="#" onclick="handleDeleteAccount(event)" class="dropdown-item danger">❌ 서비스 회원 탈퇴</a>
                <div class="dropdown-divider"></div>
                <a href="index.html" class="dropdown-item" style="color: var(--text-sub);">로그아웃</a>
            </div>
        </div>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" style="margin-left: 25px;">🌙</button>
    </nav>
</header>

<div class="container">
    <section id="rank">
        <div class="my-stats-banner">
            <div>
                <span style="opacity: 0.8; font-size: 0.9rem;">나의 현재 상태</span>
                <h3 id="myStatusText" style="font-size: 1.8rem;">로딩 중...</h3>
            </div>
            <div style="text-align: right;">
                <span style="opacity: 0.8; font-size: 0.9rem;">누적 학습 점수</span>
                <h3 id="myScoreText" style="font-size: 1.8rem; color: #f59e0b;">0 pts</h3>
            </div>
        </div>

        <div class="rank-grid">
            <div class="card">
                <h3>🌍 전체 실시간 랭킹 TOP 5</h3>
                <table class="rank-table">
                    <thead><tr><th>순위</th><th>아이디</th><th>몰입 점수</th><th>총 시간</th></tr></thead>
                    <tbody id="globalRankBody">
                        </tbody>
                </table>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3>👥 우리 그룹 랭킹 (<span style="color:var(--primary); font-weight:700;">캡스톤 A팀</span>)</h3>
                    <a href="create-group.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 700; border: 1px solid var(--primary); padding: 6px 12px; border-radius: 20px;">+ 새 그룹 만들기</a>
                </div>
                <table class="rank-table" style="margin-top: 0;">
                    <thead><tr><th>순위</th><th>아이디</th><th>몰입 점수</th><th>총 시간</th></tr></thead>
                    <tbody id="groupRankBody">
                        </tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        // 🎯 [교정] 포트번호 5001 본체 주소를 떼어내고, Nginx를 타도록 상대 경로로 수정했습니다.
        const BASE_URL = '/api/rank';
        
        // 현재 로그인한 사용자의 string_id (예: aa5467aa 혹은 rlflrh1234)
        // 로그인 시 세션스토리지에 저장해둔 진짜 값을 가져옵니다.
        const currentUserId = sessionStorage.getItem('user_id') || 'dndndd'; 

        // ── 1. [내 정보 배너] 연동 ──
        try {
            const resMe = await fetch(`${BASE_URL}/me?user_id=${currentUserId}`);
            if (resMe.ok) {
                const dataMe = await resMe.json();
                if (dataMe.ok) {
                    document.getElementById("myStatusText").innerText = `전체 ${dataMe.global_rank}위`;
                    document.getElementById("myScoreText").innerText = `${dataMe.score.toLocaleString()} pts`;
                }
            }
        } catch (e) { console.error("내 정보 로드 실패:", e); }

        // ── 2. [전체 랭킹 TOP 10] 연동 ──
        try {
            const resGlobal = await fetch(`${BASE_URL}/global`);
            if (resGlobal.ok) {
                const dataGlobal = await resGlobal.json();
                const globalBody = document.getElementById("globalRankBody");
                globalBody.innerHTML = ""; 

                if (!dataGlobal.ok || dataGlobal.data.length === 0) {
                    globalBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-sub); padding: 40px 0;">등록된 랭킹 데이터가 없습니다.</td></tr>`;
                } else {
                    dataGlobal.data.forEach((user) => {
                        let rankLabel = user.rank;
                        if (user.rank === 1) rankLabel = "🥇 1";
                        else if (user.rank === 2) rankLabel = "🥈 2";
                        else if (user.rank === 3) rankLabel = "🥉 3";

                        // 현재 로그인한 사람의 ID와 일치하면 굵게 강조
                        const isMe = user.string_id === currentUserId ? 'style="font-weight:700; color:var(--primary);"' : '';

                        globalBody.innerHTML += `
                            <tr>
                                <td>${rankLabel}</td>
                                <td ${isMe}>${user.nickname}</td>
                                <td>${user.score.toLocaleString()}</td>
                                <td>${user.study_time}</td>
                            </tr>
                        `;
                    });
                }
            }
        } catch (e) { console.error("전체 랭킹 로드 실패:", e); }

        // ── 3. [우리 그룹 랭킹] 연동 ──
        try {
            const resGroup = await fetch(`${BASE_URL}/group?user_id=${currentUserId}`);
            if (resGroup.ok) {
                const dataGroup = await resGroup.json();
                const groupBody = document.getElementById("groupRankBody");
                groupBody.innerHTML = ""; 

                if (!dataGroup.ok || !dataGroup.group || dataGroup.data.length === 0) {
                    groupBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-sub); padding: 40px 0;">등록된 그룹 데이터가 없습니다.</td></tr>`;
                } else {
                    dataGroup.data.forEach((user) => {
                        const isMe = user.is_me ? 'style="font-weight:700; color:var(--primary);"' : '';
                        groupBody.innerHTML += `
                            <tr>
                                <td>${user.rank}</td>
                                <td ${isMe}>${user.nickname}</td>
                                <td>${user.score.toLocaleString()}</td>
                                <td>${user.study_time}</td>
                            </tr>
                        `;
                    });
                }
            }
        } catch (e) { console.error("그룹 랭킹 로드 실패:", e); }
    });
</script>
<script src="script.js"></script>
</body>
</html>
